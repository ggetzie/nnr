version: 2

updates:
  # Python. Dependabot reads pyproject.toml + uv.lock; requirements.txt is gone.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # One PR per week for routine patch/minor bumps rather than a dozen.
      python-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

# No gomod entry: awslambda/rotd was removed, and awslambda/photos is a git
# submodule whose dependencies belong to the ggetzie/nnr-photos repo.
#
# The npm ecosystem is deliberately absent: package.json and package-lock.json
# were removed when the gulp pipeline was replaced by scripts/build_assets.py.
